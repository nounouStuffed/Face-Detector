<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Face Detector</title>

  <style>
    body {
      margin: 0;
      background: #0e1116;
      color: #e5e7eb;
      font-family: "JetBrains Mono", monospace;
      height: 100vh;
      overflow: hidden;
    }

    /* ===== Layout ===== */
    #app {
      height: 100vh;
      width: 100vw;
    }

    body[data-mode="normal"] #hud { display: none; }

    body[data-mode="normal"] #app {
      display: flex;
      flex-direction: column;
    }

    body[data-mode="debug"] #app {
      display: flex;
      flex-direction: row;
    }

    /* stage = zone canvas (prend le reste) */
    #stage {
      flex: 1;
      height: 100%;
      min-width: 0; /* IMPORTANT en flex pour éviter overflow */
    }

    #canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
    }

    /* ===== HUD ===== */
    #hud {
      width: 200px;
      min-width: 200px;
      height: 100%;
      padding: 18px;
      background: rgba(30, 34, 40, 0.95);
      border-left: 1px solid #2a2f36;
      box-sizing: border-box;
      overflow: auto; 
    }

    #hud h3 {
      margin: 0 0 12px;
      font-size: 13px;
      letter-spacing: 1px;
      color: #9ca3af;
    }

    .metric {
      display: flex;
      justify-content: space-between;
      margin: 8px 0;
      font-size: 12px;
    }

    .metric span:last-child {
      min-width: 90px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    #video {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .ok { color: #22c55e !important; }
    .bad { color: #ef4444 !important; }
    .warn { color: #f59e0b !important; }
    .dim { color: #9ca3af !important; }
  </style>
</head>

<body>
  <div id="app">
    <div id="stage">
      <canvas id="canvas"></canvas>
    </div>

    <div id="hud">
      <h3>FACE PIPELINE STATUS</h3>
      <div class="metric"><span>Camera</span><span id="camStatus">NO</span></div>
      <div class="metric"><span>FPS</span><span id="fps">0</span></div>
      <div class="metric"><span>Model</span><span id="modelStatus">NO</span></div>
      <div class="metric"><span>Face</span><span id="faceStatus">NO</span></div>
      <div class="metric"><span>Confidence</span><span id="confidence">0%</span></div>
      <div class="metric"><span>Progress</span><span id="progress">0%</span></div>
      <div class="metric"><span>p</span><span id="rawP">-</span></div>
      <div class="metric"><span>cx</span><span id="rawCX">-</span></div>
      <div class="metric"><span>cy</span><span id="rawCY">-</span></div>
      <div class="metric"><span>s</span><span id="rawS">-</span></div>
    </div>
  </div>

  <video id="video" autoplay playsinline muted></video>
  <script type="module" src="./camera.js"></script>
</body>
</html>
