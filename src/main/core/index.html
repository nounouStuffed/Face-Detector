<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Face Detector</title>
  <style>
    body { margin:0; background:#0e1116; color:#e5e7eb; font-family:"JetBrains Mono", monospace; }

    body[data-mode="normal"] #hud { display:none; }
    body[data-mode="debug"] #app { display:flex; height:100vh; }
    body[data-mode="debug"] #canvas { flex:1; width:100%; height:100%; display:block; }
    body[data-mode="normal"] #app { height:100vh; }
    body[data-mode="normal"] #canvas { width:100%; height:100%; display:block; }

    canvas { background:#000; }

    #hud {
      width: 200px;
      min-width: 200px;
      padding: 18px;
      background: rgba(30,34,40,0.95);
      border-left: 1px solid #2a2f36;
      overflow-y: auto;
    }

    .panel-title {
      margin: 0 0 10px;
      font-size: 13px;
      letter-spacing: 1px;
      color: #9ca3af;
    }

    .divider {
      height: 1px;
      background: #2a2f36;
      margin: 14px 0;
      opacity: 0.9;
    }

    .metric {
      display:flex;
      justify-content:space-between;
      margin:8px 0;
      font-size:12px;
    }
    .metric span:last-child { min-width: 120px; text-align:right; }

    #video { position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }

    .ok { color:#22c55e !important; }
    .bad { color:#ef4444 !important; }
    .warn { color:#f59e0b !important; }
    .dim { color:#9ca3af !important; }
  </style>
</head>

<body data-mode="normal">
  <div id="app">
    <canvas id="canvas"></canvas>

    <div id="hud">
      <div id="panels"></div>
    </div>
  </div>

  <video id="video" autoplay playsinline muted></video>
  <script type="module" src="./camera.js"></script>
</body>
</html>
